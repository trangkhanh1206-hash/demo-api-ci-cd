name: Automated API tests using Postman CLI

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
      - name: 2. Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: 3. Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: 4. Run API tests
        run: |
          postman collection run "34104301-6d11075e-b109-4c38-a049-0d0808e2703b" -e "34104301-551556bd-d9d9-4dc2-a919-28d7d8da885e" -d booking_data.csv
     

